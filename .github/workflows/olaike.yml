name: Deploy React App via SSH

on:
  push:
    branches:
      - olaike  # Or your deployment branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      CI: false
      REACT_APP_BASE_URL: ${{ secrets.OLAIKE_REACT_APP_BASE_URL }}
      REACT_APP_BASE_URL_SOCKET: ${{ secrets.OLAIKE_REACT_APP_BASE_URL_SOCKET }}
      REACT_APP_WEB_URL: ${{ secrets.OLAIKE_REACT_APP_WEB_URL }}
      REACT_APP_PAYSTACK_PUBLIC_KEY: "secrets.OLAIKE_PAYSTACK_PUBLIC_KEY"
      REACT_APP_PAYMENT_PROVIDER: "kegow" # kegow or paystack

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18  # Change if needed

      - name: Install Dependencies
        run: npm install

      - name: Build React App
        run: npm run build

      - name: Copy Files to Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "build/*"
          target: ${{ secrets.OLAIKE_REACT_APP_WEB_ROOT_DIR }}

      - name: Restart App on Server (Optional)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ${{ secrets.OLAIKE_REACT_APP_WEB_ROOT_DIR }}
            echo "Deployment complete"
