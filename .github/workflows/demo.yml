name: Deploy React Application

on:
  push:
    branches:
      - demo

jobs:
  deploy:
    name: Deploy React App to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build React application
        run: npm run build
        env:
          CI: false
          REACT_APP_BASE_URL: ${{ secrets.REACT_APP_BASE_URL }}
          REACT_APP_BASE_URL_SOCKET: ${{ secrets.REACT_APP_BASE_URL_SOCKET }}
          REACT_APP_WEB_URL: ${{ secrets.REACT_APP_WEB_URL }}
          REACT_APP_PAYSTACK_PUBLIC_KEY: "pk_test_abea14b8413cb3f06f2d652fced67a2d1a29ede7"

      - name: Verify 'build' directory content
        run: |
          echo "Listing contents of 'build/' directory:"
          ls -la build/
          echo "Disk usage of 'build/' directory:"
          du -sh build/

      - name: Archive built files
        run: |
          cd build/
          tar -czf ../react-app.tar.gz .

      - name: Prepare Staging Directory on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eux

            # --- DIAGNOSTIC COMMANDS ---
            echo "--- Sudo Diagnostic Info ---"
            echo "User executing SSH script: $(whoami)"
            echo "Environment variables:"
            env | sort
            echo "Output of sudo -l for current user:"
            sudo -l -U $(whoami) # This is crucial: confirms sudoers from inside the action
            echo "--- End Sudo Diagnostic Info ---"

            echo "Ensuring staging directory exists and has correct permissions for SCP."
            mkdir -p ${{ secrets.REACT_APP_STAGING_DIR }}
            sudo chown -R ${{ secrets.SERVER_USER }}:${{ secrets.SERVER_USER }} ${{ secrets.REACT_APP_STAGING_DIR }}
            sudo chmod 755 ${{ secrets.REACT_APP_STAGING_DIR }}
            echo "Staging directory preparation complete."

      - name: Copy built files to server staging directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "react-app.tar.gz"
          target: ${{ secrets.REACT_APP_STAGING_DIR }}

      - name: SSH into server and deploy React app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eux

            cd ${{ secrets.REACT_APP_STAGING_DIR }}

            tar -xzf react-app.tar.gz

            rm react-app.tar.gz

            sudo rm -rf ${{ secrets.REACT_APP_WEB_ROOT_DIR }}/*
            sudo mv -T . ${{ secrets.REACT_APP_WEB_ROOT_DIR }}
            sudo chown -R www-data:www-data ${{ secrets.REACT_APP_WEB_ROOT_DIR }}
            sudo systemctl reload nginx