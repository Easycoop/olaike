name: Deploy React Application

on:
  push:
    branches:
      - demo # Change to your demo branch name

jobs:
  deploy:
    name: Deploy React App to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Change to your Node.js version

      - name: Install dependencies
        run: npm install

      - name: Build React application
        run: npm run build # This command creates the 'build' folder with optimized production assets
        env:
          CI: false
          REACT_APP_BASE_URL: ${{ secrets.REACT_APP_BASE_URL }}
          REACT_APP_BASE_URL_SOCKET: ${{ secrets.REACT_APP_BASE_URL_SOCKET }}
          REACT_APP_WEB_URL: ${{ secrets.REACT_APP_WEB_URL }}
          REACT_APP_PAYSTACK_PUBLIC_KEY: "pk_test_abea14b8413cb3f06f2d652fced67a2d1a29ede7"

      - name: Archive built files
        run: tar -czf react-app.tar.gz -C build .

      - name: Copy built files to server staging directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # --- CHANGE THIS LINE ---
          # Specify the full path including the filename, so it only copies, not untars.
          target: "${{ secrets.REACT_APP_STAGING_DIR }}/react-app.tar.gz" 

      - name: SSH into server and deploy React app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eux # Keep this for continued debugging visibility

            # Ensure the staging directory exists and is owned by the current user
            mkdir -p ${{ secrets.REACT_APP_STAGING_DIR }}
            sudo chown -R ${{ secrets.SERVER_USER }}:${{ secrets.SERVER_USER }} ${{ secrets.REACT_APP_STAGING_DIR }}
            sudo chmod 755 ${{ secrets.REACT_APP_STAGING_DIR }}

            # Navigate to the temporary staging directory on the server
            cd ${{ secrets.REACT_APP_STAGING_DIR }}

            # Now, you explicitly untar the file after permissions are set
            tar -xzf react-app.tar.gz 

            # Remove the tarball after extraction
            rm react-app.tar.gz

            # --- Deployment to the actual web server root ---
            sudo rm -rf ${{ secrets.REACT_APP_WEB_ROOT_DIR }}/*
            sudo mv -T . ${{ secrets.REACT_APP_WEB_ROOT_DIR }}
            sudo chown -R www-data:www-data ${{ secrets.REACT_APP_WEB_ROOT_DIR }}
            sudo systemctl reload nginx